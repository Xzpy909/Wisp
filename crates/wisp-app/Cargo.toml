[package]
name = "wisp-app"
description = "Wisp clipboard manager"
version.workspace = true
edition.workspace = true

[[bin]]
name = "wisp"
path = "src/main.rs"

[dependencies]
wisp-core.workspace = true

slint = { version = "1.19", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-winit",
  "renderer-femtovg",
  "renderer-software",
  "raw-window-handle-06",
] }

[target.'cfg(windows)'.dependencies]
wisp-win.workspace = true
tray-icon = "0.27"
global-hotkey = "0.10"
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1.19"
embed-resource = "3"
