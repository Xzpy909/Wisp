[workspace]
resolver = "2"
members = ["crates/wisp-core", "crates/wisp-win", "crates/wisp-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/Xzpy909/Wisp"

[workspace.dependencies]
wisp-core = { path = "crates/wisp-core" }
wisp-win = { path = "crates/wisp-win" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
