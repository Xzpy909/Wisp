name: Release

# Publish a release on GitHub (Releases > Draft a new release, tag v0.2.0 matching
# the version in Cargo.toml), or push such a tag. Either way this builds the
# installer and a portable zip and attaches them to the release.
on:
  release:
    types: [published]
  push:
    tags: ["v*"]

permissions:
  contents: write

# Publishing on the website also creates the tag; run one job at a time per tag.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches the version
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'wisp-app' | Select-Object -ExpandProperty version
          if ("v$version" -ne "$env:TAG") {
            throw "Tag $env:TAG does not match Cargo.toml version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --release -p wisp-app
      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ steps.version.outputs.version }} /DSourceExe=..\target\release\wisp.exe installer\wisp.iss
      - name: Portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path target\release\wisp.exe -DestinationPath dist\Wisp-${{ steps.version.outputs.version }}-portable.zip
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          # A release made on the website already exists: just attach the files.
          gh release view "$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG" (Get-ChildItem dist\*.exe, dist\*.zip) --clobber
          } else {
            gh release create "$env:TAG" (Get-ChildItem dist\*.exe, dist\*.zip) `
              --title "Wisp ${{ steps.version.outputs.version }}" --generate-notes
          }
