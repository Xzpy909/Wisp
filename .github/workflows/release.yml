name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to publish a release
# with the installer and a portable zip.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches the version
        id: version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'wisp-app' | Select-Object -ExpandProperty version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --release -p wisp-app
      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ steps.version.outputs.version }} /DSourceExe=..\target\release\wisp.exe installer\wisp.iss
      - name: Portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path target\release\wisp.exe -DestinationPath dist\Wisp-${{ steps.version.outputs.version }}-portable.zip
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist\*.exe dist\*.zip `
            --title "Wisp ${{ steps.version.outputs.version }}" --generate-notes
